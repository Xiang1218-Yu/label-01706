# ============================================
# Docker Compose 开发环境配置文件
# 功能：定义开发环境特定的配置
# 使用方式：docker-compose -f docker-compose.base.yml -f docker-compose.development.yml up
# ============================================

version: "3.8"

services:
  frontend-user:
    # 构建参数 - 指定构建环境为开发环境
    build:
      args:
        BUILD_ENV: development
    # 开发环境容器名称
    container_name: watermark-remover-frontend-dev
    # 端口映射 - 开发环境使用8081端口
    ports:
      - "8081:80"
    # 开发环境环境变量
    environment:
      - NODE_ENV=development
      - API_BASE_URL=http://localhost:3000/api
      - DEBUG=true
    # 开发环境卷挂载 - 实现热更新
    volumes:
      - ./frontend-user/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend-user/css/:/usr/share/nginx/html/css/:ro
      - ./frontend-user/js/:/usr/share/nginx/html/js/:ro
      - ./frontend-user/nginx/nginx.development.conf:/etc/nginx/conf.d/default.conf:ro
    # 开发环境日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
