# ============================================
# CI/CD 自动化工作流配置
# 功能：
#   - 代码提交时自动执行构建测试
#   - 支持多环境部署（开发/测试/生产）
#   - 自动构建并推送Docker镜像
#   - 部署到相应环境
# ============================================

name: CI/CD Pipeline

# ============================================
# 权限配置 - 修复GitHub Packages推送权限问题
# ============================================
permissions:
  contents: read
  packages: write
  id-token: write

# ============================================
# 触发条件
# ============================================
on:
  # 推送到特定分支时触发
  push:
    branches:
      - develop    # 开发环境
      - test       # 测试环境
      - main       # 生产环境
    paths:
      - 'frontend-user/**'
      - '.github/workflows/**'
  
  # Pull Request 时触发（只构建不推送）
  pull_request:
    branches:
      - develop
      - test
      - main
    paths:
      - 'frontend-user/**'
  
  # 手动触发部署
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - test
          - production

# ============================================
# 环境变量配置
# ============================================
env:
  DOCKER_IMAGE_NAME: watermark-remover-frontend
  DOCKER_REGISTRY: ghcr.io

# ============================================
# 任务定义
# ============================================
jobs:
  # ============================================
  # 第一阶段：代码检查和测试
  # ============================================
  lint-and-test:
    name: 代码检查和测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Node.js环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 检查HTML语法
        run: |
          echo "检查HTML文件语法..."
          if [ -f "frontend-user/index.html" ]; then
            echo "✓ HTML文件存在"
          fi

      - name: 检查JavaScript语法
        run: |
          echo "检查JavaScript文件..."
          for file in frontend-user/js/*.js; do
            if [ -f "$file" ]; then
              echo "✓ $file 存在"
            fi
          done

      - name: 检查CSS语法
        run: |
          echo "检查CSS文件..."
          for file in frontend-user/css/*.css; do
            if [ -f "$file" ]; then
              echo "✓ $file 存在"
            fi
          done

  # ============================================
  # 第二阶段：构建Docker镜像
  # 根据触发条件自动决定构建哪些环境
  # ============================================
  build-docker:
    name: 构建Docker镜像 (${{ matrix.environment }})
    needs: lint-and-test
    runs-on: ubuntu-latest
    strategy:
      # 关键：一个环境构建失败不影响其他环境
      fail-fast: false
      matrix:
        # 根据触发分支动态选择构建环境
        environment: ${{ 
          (github.ref == 'refs/heads/develop' || github.event.inputs.environment == 'development') && fromJSON('["development"]') || 
          (github.ref == 'refs/heads/test' || github.event.inputs.environment == 'test') && fromJSON('["test"]') || 
          (github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production') && fromJSON('["production"]') || 
          fromJSON('["development", "test", "production"]') }}
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录Docker镜像仓库
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 修复镜像路径格式 - 使用完整仓库路径（包含仓库名）
          # 格式：ghcr.io/所有者/仓库名/镜像名
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=sha,prefix=${{ matrix.environment }}-
            type=raw,value=${{ matrix.environment }}-latest

      - name: 构建并推送镜像（非PR）
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-user
          file: ./frontend-user/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_ENV=${{ matrix.environment }}
          cache-from: type=gha,scope=${{ matrix.environment }}
          cache-to: type=gha,scope=${{ matrix.environment }},mode=max

      - name: 仅构建镜像（PR时）
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-user
          file: ./frontend-user/Dockerfile
          platforms: linux/amd64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_ENV=${{ matrix.environment }}
          cache-from: type=gha,scope=${{ matrix.environment }}
          cache-to: type=gha,scope=${{ matrix.environment }},mode=max

  # ============================================
  # 第三阶段：部署到对应环境
  # 根据构建矩阵自动部署
  # ============================================
  deploy:
    name: 部署到${{ matrix.environment }}环境
    needs: build-docker
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ 
          (github.ref == 'refs/heads/develop' || github.event.inputs.environment == 'development') && fromJSON('["development"]') || 
          (github.ref == 'refs/heads/test' || github.event.inputs.environment == 'test') && fromJSON('["test"]') || 
          (github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production') && fromJSON('["production"]') || 
          fromJSON('[]') }}
    environment: ${{ matrix.environment }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 部署到${{ matrix.environment }}服务器
        run: |
          echo "========================================"
          echo "部署到${{ matrix.environment }}环境"
          echo "环境: ${{ matrix.environment }}"
          echo "分支: ${{ github.ref }}"
          echo "提交: ${{ github.sha }}"
          echo "镜像: ghcr.io/${{ github.repository }}/${{ env.DOCKER_IMAGE_NAME }}:${{ matrix.environment }}-latest"
          echo "========================================"
          
          # 这里可以添加实际的部署命令，例如：
          # - 连接到部署服务器
          # - 拉取最新镜像
          # - 重启服务
          
          if [ "${{ matrix.environment }}" = "production" ]; then
            echo "⚠️ 生产环境部署"
          fi
          
          echo "✓ ${{ matrix.environment }}环境部署完成"
          
          # 输出访问地址
          case ${{ matrix.environment }} in
            development)
              echo "访问地址: http://localhost:8081"
              ;;
            test)
              echo "访问地址: http://localhost:8082"
              ;;
            production)
              echo "访问地址: https://example.com"
              ;;
          esac
