# Docker Compose 多环境编排配置
# 支持一键启动开发、测试、生产环境
version: '3.8'

services:
  # 开发环境
  frontend-dev:
    build:
      context: .
      args:
        APP_ENV: development
        API_BASE_URL: http://localhost:3000/api
    ports:
      - "8080:80"
    volumes:
      # 开发环境挂载本地文件，实现热更新
      - ./index.html:/usr/share/nginx/html/index.html
      - ./css/:/usr/share/nginx/html/css/
      - ./js/:/usr/share/nginx/html/js/
      - ./libs/:/usr/share/nginx/html/libs/
    environment:
      - NODE_ENV=development
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # 测试环境
  frontend-test:
    build:
      context: .
      args:
        APP_ENV: test
        API_BASE_URL: https://test-api.example.com/api
    ports:
      - "8081:80"
    environment:
      - NODE_ENV=test
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # 生产环境
  frontend-prod:
    build:
      context: .
      args:
        APP_ENV: production
        API_BASE_URL: https://api.example.com/api
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
