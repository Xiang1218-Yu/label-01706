# CI/CD 自动化构建部署工作流
# 支持开发、测试、生产三个环境的自动化构建和部署
name: Frontend CI/CD

on:
  push:
    branches:
      - main        # 生产环境分支
      - develop     # 开发环境分支
      - test        # 测试环境分支
  pull_request:
    branches:
      - main
      - develop
      - test

# 环境变量配置
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/frontend-user

jobs:
  # 代码检查和测试阶段
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate HTML/CSS/JS
        uses: w3c/validators-action@v1
        with:
          files: |
            frontend-user/index.html
            frontend-user/css/*.css
            frontend-user/js/*.js

  # 构建Docker镜像阶段
  build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=long

      # 确定构建环境
      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "env=production" >> $GITHUB_OUTPUT
            echo "api_url=${{ secrets.PRODUCTION_API_URL }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/test" ]]; then
            echo "env=test" >> $GITHUB_OUTPUT
            echo "api_url=${{ secrets.TEST_API_URL }}" >> $GITHUB_OUTPUT
          else
            echo "env=development" >> $GITHUB_OUTPUT
            echo "api_url=${{ secrets.DEVELOPMENT_API_URL }}" >> $GITHUB_OUTPUT
          fi

      # 构建并推送镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-user
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_ENV=${{ steps.env.outputs.env }}
            API_BASE_URL=${{ steps.env.outputs.api_url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 部署阶段
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ steps.env.outputs.env }}
    steps:
      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "env=production" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/test" ]]; then
            echo "env=test" >> $GITHUB_OUTPUT
          else
            echo "env=development" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to ${{ steps.env.outputs.env }} environment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 拉取最新镜像
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            
            # 停止旧容器
            docker stop frontend-user-${{ steps.env.outputs.env }} || true
            docker rm frontend-user-${{ steps.env.outputs.env }} || true
            
            # 启动新容器
            docker run -d \
              --name frontend-user-${{ steps.env.outputs.env }} \
              --restart always \
              -p ${{ secrets.PORT }}:80 \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            
            # 清理旧镜像
            docker image prune -f
