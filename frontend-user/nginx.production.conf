# 生产环境 Nginx 配置
# 用于正式生产环境部署，注重安全性和性能

# 生产环境只允许正式域名访问
if ($host !~* ^.*\.example\.com$) {
    return 403;
}

# 生产环境开启 HSTS
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

