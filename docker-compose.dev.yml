# ============================================
# Docker Compose 开发环境配置文件
# 特性：
#   - 热重载（文件变更自动生效）
#   - 禁用缓存，便于调试
#   - 暴露更多端口用于调试
#   - 详细日志输出
# ============================================

version: "3.8"

services:
  frontend-user:
    # 使用开发阶段构建
    build:
      target: development
      args:
        BUILDPLATFORM: linux/amd64
    container_name: frontend-user-dev
    ports:
      - "8080:80"
    volumes:
      # 挂载源代码目录，实现热重载
      - ./frontend-user/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend-user/css:/usr/share/nginx/html/css:ro
      - ./frontend-user/js:/usr/share/nginx/html/js:ro
      - ./frontend-user/libs:/usr/share/nginx/html/libs:ro
      # 挂载日志目录
      - ./logs/dev:/var/log/nginx
    environment:
      # 环境标识
      ENV_NAME: development
      # API 地址（开发环境通常指向本地后端）
      API_BASE_URL: http://localhost:3000
      # Nginx 端口
      NGINX_PORT: 80
      # 禁用缓存，便于开发调试
      CACHE_ENABLED: "false"
      # 禁用 gzip，便于查看原始请求
      GZIP_ENABLED: "false"
    # 开发环境总是重启
    restart: always
    # 启用 TTY，便于查看日志
    tty: true
    # 开发环境不使用健康检查（避免频繁重启）
    healthcheck:
      disable: true
