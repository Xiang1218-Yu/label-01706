# ============================================
# Trivy Secret 扫描配置文件
# 用于优化密钥检测速度和准确率
# 参考: https://trivy.dev/docs/v0.69/guide/scanner/secret#recommendation
# ============================================

# 启用的扫描规则
rules:
  # AWS 相关
  - aws-access-key-id
  - aws-secret-access-key
  # GitHub 相关
  - github-personal-access-token
  - github-oauth-access-token
  # GitLab 相关
  - gitlab-personal-access-token
  # 通用密钥
  - generic-api-key
  - generic-secret
  # 私钥
  - asymmetric-private-key
  - ssh-private-key
  # Slack
  - slack-access-token
  # GCP
  - gcp-service-account-key

# 允许的路径（这些路径中的密钥不会被报告）
allow-paths:
  # 测试文件
  - "**/test/**"
  - "**/tests/**"
  - "**/*_test.go"
  - "**/*.test.js"
  - "**/*.spec.js"
  # 文档和示例
  - "**/examples/**"
  - "**/samples/**"
  - "**/*.md"
  - "**/*.txt"
  - "**/README*"
  # 配置文件模板
  - "**/*.example"
  - "**/*.template"
  - "**/env.example"
  - "**/.env.example"
  # 构建相关
  - "**/node_modules/**"
  - "**/vendor/**"
  - "**/dist/**"
  - "**/build/**"
  # 日志文件
  - "**/*.log"
  - "**/logs/**"

# 禁用内置的允许规则（如果需要更严格的扫描）
# disable-allow-rules: true
