# ============================================
# Docker Compose 生产环境配置文件
# 特性：
#   - 生产级优化配置
#   - 启用所有安全特性
#   - 资源限制
#   - 高可用配置
#   - 日志轮转
# ============================================

version: "3.8"

services:
  frontend-user:
    # 使用生产阶段构建
    build:
      target: production
      args:
        BUILDPLATFORM: linux/amd64
    container_name: frontend-user-prod
    ports:
      - "80:80"
    volumes:
      # 挂载日志目录（持久化）
      - ./logs/prod:/var/log/nginx
      - nginx-logs:/var/log/nginx
    environment:
      # 环境标识
      ENV_NAME: production
      # API 地址（生产环境）
      API_BASE_URL: https://api.example.com
      # Nginx 端口
      NGINX_PORT: 80
      # 启用缓存（生产环境）
      CACHE_ENABLED: "true"
      # 启用 gzip 压缩
      GZIP_ENABLED: "true"
    # 生产环境总是重启
    restart: always
    # 资源限制（生产环境重要配置）
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
      # 重启策略
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
        window: 120s
    # 健康检查配置
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    # 安全配置
    security_opt:
      - no-new-privileges:true
    # 只读根文件系统（增强安全性）
    read_only: true
    # 临时文件系统
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
